<svg width="900" height="24" viewBox="0 0 900 24" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
    <stop offset="15%" stop-color="#00FF88"/>
    <stop offset="50%" stop-color="#D4AF37"/>
    <stop offset="85%" stop-color="#00FF88"/>
    <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    <animate attributeName="x1" values="-50%;150%" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="50%;250%" dur="3.5s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<rect x="0" y="10" width="900" height="3" fill="url(#lineGrad)"/>
<circle cx="450.0" cy="11.5" r="4" fill="#00FF88">
  <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
</circle>
</svg>