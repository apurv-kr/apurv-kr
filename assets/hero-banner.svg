<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00FF88"/>
    <stop offset="50%" stop-color="#D4AF37"/>
    <stop offset="100%" stop-color="#00FF88"/>
    <animate attributeName="x1" values="-100%;100%;-100%" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0%;200%;0%" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00FF88"/>
    <stop offset="100%" stop-color="#D4AF37"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect x="2" y="2" width="896" height="256" rx="14" fill="#0D1117" stroke="url(#borderGrad)" stroke-width="3"/>

<!-- terminal top bar -->
<rect x="2" y="2" width="896" height="34" rx="14" fill="#161B22"/>
<rect x="2" y="22" width="896" height="14" fill="#161B22"/>
<circle cx="26" cy="19" r="6" fill="#FF5F56"/>
<circle cx="46" cy="19" r="6" fill="#FFBD2E"/>
<circle cx="66" cy="19" r="6" fill="#27C93F"/>
<text x="450.0" y="24" text-anchor="middle" font-family="monospace" font-size="12" fill="#8B949E">apurv-kr@github :: ~/portfolio :: zsh</text>

<!-- body -->
<text x="40" y="80" font-family="monospace" font-size="15" fill="#8B949E">root@apurv-kr:~$ <tspan fill="#00FF88">whoami</tspan></text>

<text x="40" y="130" font-family="'Fira Code', monospace" font-size="42" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)" opacity="0">
  APURV KUMAR
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2;1" dur="1.6s" begin="0.3s" fill="freeze"/>
</text>

<text x="40" y="165" font-family="monospace" font-size="17" fill="#D4AF37" opacity="0">
  &gt;_ Full Stack Software Engineer
  <animate attributeName="opacity" values="0;0;1" dur="1.2s" begin="1.6s" fill="freeze"/>
</text>

<text x="40" y="192" font-family="monospace" font-size="14" fill="#00FF88" opacity="0">
  &gt;_ India · Node.js · TypeScript · React · System Design
  <animate attributeName="opacity" values="0;0;1" dur="1.2s" begin="2.1s" fill="freeze"/>
</text>

<text x="40" y="228" font-family="monospace" font-size="14" fill="#8B949E" opacity="0">
  status: <tspan fill="#00FF88">ONLINE</tspan> ● ready for input
  <animate attributeName="opacity" values="0;0;1" dur="1.2s" begin="2.6s" fill="freeze"/>
</text>

<rect x="330" y="216" width="10" height="16" fill="#00FF88" opacity="0">
  <animate attributeName="opacity" values="0;0;1" dur="0.4s" begin="2.6s" fill="freeze"/>
  <animate attributeName="opacity" values="1;0" dur="0.8s" begin="3s" repeatCount="indefinite"/>
</rect>

</svg>